# File provider: no Docker socket is exposed to Traefik (least privilege, spec §26).
http:
  routers:
    api:
      rule: "PathPrefix(`/api`) || PathPrefix(`/socket.io`)"
      service: api
      entryPoints: [web]
      priority: 10
    # Authentik lives on its own host (auth.localhost locally, auth-puntquiz.<domain> in prod).
    authentik:
      rule: "HostRegexp(`^auth[.-].+`)"
      service: authentik
      entryPoints: [web]
      priority: 20
    web:
      rule: "PathPrefix(`/`)"
      service: web
      entryPoints: [web]
      priority: 1
  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:3001"
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
    web:
      loadBalancer:
        servers:
          - url: "http://web:3000"
