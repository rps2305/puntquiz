<!doctype html>

<title>Geen verbinding — PuntQuiz</title>
<style>

  p { line-height: 1.5; }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 14px 22px; min-height: 48px; background: #FF5A38; color: #241512; cursor: pointer; }

<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Geen verbinding</h1>
  <p>Je lijkt even offline te zijn. Zit je in een quiz? Je laatste antwoord wordt bewaard en verstuurd zodra je weer verbinding hebt, en je hebt 60 seconden om terug te komen.</p>
  <p><button onclick="location.reload()">Opnieuw proberen</button></p>
